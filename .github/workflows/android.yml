name: Android
on:
  pull_request:
    paths: ['Android/**', 'Server/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['Android/**', 'Server/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install API test dependencies
        run: python3 -m pip install -r Server/requirements-api.txt
      - name: Test authentication, limits and workers
        working-directory: Server
        run: python3 -m unittest -v test_server
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK components
        run: |
          tablelog_sdk="$RUNNER_TEMP/tablelog-android-sdk"
          tablelog_archive="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip --output "$tablelog_archive"
          printf '%s  %s\n' '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' "$tablelog_archive" | sha256sum --check -
          mkdir -p "$tablelog_sdk/cmdline-tools"
          unzip -q "$tablelog_archive" -d "$tablelog_sdk/cmdline-tools"
          mv "$tablelog_sdk/cmdline-tools/cmdline-tools" "$tablelog_sdk/cmdline-tools/latest"
          set +o pipefail
          yes | "$tablelog_sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$tablelog_sdk" --licenses > /dev/null
          set -o pipefail
          "$tablelog_sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$tablelog_sdk" 'platforms;android-36' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$tablelog_sdk" > local.properties
      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :fishapp:testDebugUnitTest :fishapp:lintDebug :fishapp:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: TableLog-Android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: FishAudio-Android-debug
          path: Android/fishapp/build/outputs/apk/debug/fishapp-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-verification
          path: |
            Android/app/build/reports/tests/
            Android/app/build/reports/lint-results-debug.html
